name: Build and Deploy

on:
  push:
    branches:
      - main

# 짧은 간격으로 여러 번 푸시하면 배포가 동시에 실행되어
# 한쪽의 docker rm 과 다른 쪽의 docker run 이 겹치면서 컨테이너 이름 충돌이 난다.
# 순차 실행으로 직렬화한다(진행 중인 배포는 취소하지 않고 큐에 넣는다).
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./online_law  
          push: true
          tags: ghcr.io/hojunelee0106/online_law:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: "20m"
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker stop online-law || true
            # -f 로 강제 제거. stop 이 타임아웃되어 컨테이너가 남아 있어도
            # 다음 run 이 이름 충돌로 실패하지 않게 한다.
            docker rm -f online-law || true
            docker image prune -af
            docker pull ghcr.io/hojunelee0106/online_law:latest
            # DB 는 파일이 아니라 디렉터리(app_data)를 통째로 마운트한다.
            # checkpoints.db 는 langgraph 가 journal_mode=WAL 로 열기 때문에
            # 실제 쓰기가 옆의 -wal 파일에 쌓이는데, 파일 단위로 마운트하면
            # 그 -wal 이 컨테이너 안에만 생긴다. 배포 때 docker rm -f 로
            # 컨테이너를 SIGKILL 하면 아직 본 파일에 합쳐지지 않은 대화 이력이
            # 통째로 날아갔다(대화 목록은 users.db 라 남고 내용만 사라짐).
            # chroma 두 개는 /app/var 위에 겹쳐 마운트된다(Docker 가 목적지
            # 깊이 순으로 적용하므로 중첩이 동작한다).
            docker run -d --name online-law \
              --restart unless-stopped \
              -p 8000:8000 \
              -v /home/ubuntu/app_data:/app/var \
              -v /home/ubuntu/chroma_data/chroma_persist:/app/var/chroma_persist \
              -v /home/ubuntu/chroma_data/chroma_qa:/app/var/chroma_qa \
              -e ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
              -e ANTHROPIC_MODEL="claude-sonnet-5" \
              -e LLM_EFFORT="low" \
              -e LLM_PROVIDER="anthropic" \
              ghcr.io/hojunelee0106/online_law:latest