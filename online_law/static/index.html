<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>법대로</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* 브라운 계열. 회색빛 배경 대신 따뜻한 톤으로 맞춘다 */
      --bg: #f7f4f0; --panel: #ffffff; --sidebar: #2b2118;
      --sidebar-hover: #3a2d22; --sidebar-active: #8b5e3c;
      --line: #e6ded5; --text: #241d17; --muted: #7b6b5e;
      /* 답변 말풍선은 페이지 배경(--bg)과 확실히 구분되어야 한다.
         이전 값 #eef0f3 은 배경 #f4f5f7 과 거의 같아 경계가 안 보였다. */
      --accent: #8b5e3c; --user-bubble: #8b5e3c; --bot-bubble: #ffffff; --danger: #b0413a;
    }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden;
    }
    #auth { position: fixed; inset: 0; background: var(--bg); display: flex;
      align-items: center; justify-content: center; z-index: 20; }
    #auth .card { background: #fff; padding: 36px 32px; border-radius: 16px; width: 340px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08); border: 1px solid var(--line); }
    #auth h1 { font-size: 20px; margin-bottom: 4px; }
    #auth .tagline { font-size: 13px; color: var(--muted); margin-bottom: 22px; }
    #auth label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
    #auth input { width: 100%; border: 1px solid var(--line); border-radius: 10px;
      padding: 11px 13px; font-size: 15px; outline: none; }
    #auth input:focus { border-color: var(--accent); }
    #auth button.primary { width: 100%; margin-top: 20px; background: var(--accent); color: #fff;
      border: none; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
    #auth button.primary:disabled { opacity: .5; cursor: not-allowed; }
    #auth .toggle { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
    #auth .toggle a { color: var(--accent); cursor: pointer; font-weight: 600; }
    #auth .msg { font-size: 13px; margin-top: 12px; min-height: 18px; }
    #auth .msg.error { color: var(--danger); }
    #auth .msg.ok { color: #2a8; }
    #auth .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
    #sidebar { width: 260px; background: var(--sidebar); color: #e6e8ee;
      display: flex; flex-direction: column; flex-shrink: 0; }
    #sidebar .top { padding: 16px; }
    #newChat { width: 100%; background: var(--sidebar-active); color: #fff; border: none;
      border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 600; cursor: pointer; }
    #convList { flex: 1; overflow-y: auto; padding: 4px 8px; }
    .conv-item { padding: 10px 12px; border-radius: 8px; font-size: 14px; cursor: pointer;
      color: #c7cbd6; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
    .conv-item span.title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-item:hover { background: var(--sidebar-hover); }
    .conv-item.active { background: var(--sidebar-hover); color: #fff; }
    .conv-item .del { flex-shrink: 0; color: #8a90a0; padding: 2px 6px; border-radius: 6px;
      opacity: 0; font-size: 15px; line-height: 1; }
    .conv-item:hover .del { opacity: 1; }
    .conv-item .del:hover { color: #fff; background: var(--danger); }
    #sidebar .bottom { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,.08);
      font-size: 13px; color: #9aa0ae; display: flex; justify-content: space-between; align-items: center; }
    #sidebar .bottom a { color: #9aa0ae; cursor: pointer; }
    #sidebar .bottom a:hover { color: #fff; }
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    header { padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0; }
    header h2 { font-size: 16px; }
    header .sub { font-size: 12px; color: var(--muted); }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg { display: flex; max-width: 780px; width: 100%; margin: 0 auto; }
    .msg .bubble { padding: 12px 16px; border-radius: 14px; font-size: 15px; line-height: 1.6;
      white-space: pre-wrap; word-break: break-word; }
    .msg.user { justify-content: flex-end; }
    .msg.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; max-width: 75%; }
    .msg.bot .bubble { background: var(--bot-bubble); color: var(--text); border-bottom-left-radius: 4px;
      max-width: 85%; border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(16,24,40,.04); }
    /* 마크다운으로 렌더한 답변. pre-wrap 을 끄지 않으면 블록 사이 줄바꿈이 이중으로 벌어진다 */
    .bubble.md { white-space: normal; }
    .bubble.md .md-body > *:first-child { margin-top: 0; }
    .bubble.md .md-body > *:last-child { margin-bottom: 0; }
    .bubble.md p { margin: 0 0 10px; }
    .bubble.md h3, .bubble.md h4, .bubble.md h5 { margin: 14px 0 6px; font-size: 15px; font-weight: 700; }
    .bubble.md ul, .bubble.md ol { margin: 0 0 10px; padding-left: 20px; }
    .bubble.md li { margin: 3px 0; }
    .bubble.md strong { font-weight: 700; }
    .bubble.md code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
    .sources { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
    .sources summary { cursor: pointer; color: var(--muted); font-size: 13px; user-select: none; }
    .sources summary:hover { color: var(--accent); }
    .sources ul { margin: 8px 0 0; padding-left: 0; list-style: none; }
    .sources li { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 2px 0;
      white-space: normal; word-break: break-word; cursor: pointer;
      padding: 4px 8px; border-radius: 6px; border: 1px solid transparent; }
    .sources li:hover, .sources li.active {
      background: #f3ece4; border-color: var(--line); color: var(--text); }

    /* 오른쪽 원문 패널. 검색된 자료의 본문을 그대로 보여준다 */
    #docPanel { width: 360px; flex-shrink: 0; background: var(--panel);
      border-left: 1px solid var(--line); display: none; flex-direction: column; }
    #docPanel.open { display: flex; }
    #docPanel .head { padding: 14px 16px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    #docPanel .head strong { font-size: 14px; }
    #docPanel .head .close { margin-left: auto; cursor: pointer; color: var(--muted);
      font-size: 18px; line-height: 1; padding: 0 4px; }
    #docPanel .head .close:hover { color: var(--text); }
    #docTitle { padding: 12px 16px 0; font-size: 13px; font-weight: 700; color: var(--accent);
      word-break: break-word; }
    #docBody { padding: 8px 16px 20px; overflow-y: auto; font-size: 13px; line-height: 1.7;
      white-space: pre-wrap; word-break: break-word; color: var(--text); flex: 1; }
    #docHint { padding: 16px; color: var(--muted); font-size: 13px; }
    @media (max-width: 1100px) { #docPanel.open { display: none; } }
    .msg.bot .bubble.pending::after { content: "▋"; animation: blink 1s steps(2) infinite; color: var(--muted); }
    @keyframes blink { 0%,50%{opacity:1;} 50.01%,100%{opacity:0;} }
    .msg.bot .bubble.status { color: var(--muted); font-style: italic; }
    .msg.bot .bubble.status::after { content: ""; animation: none; }
    .status-dots::after { content: "·"; animation: dots 1.2s steps(4) infinite; }
    @keyframes dots { 0%{content:"·";} 25%{content:"··";} 50%{content:"···";} 75%{content:"";} }
    .empty-hint { text-align: center; color: var(--muted); font-size: 13px; margin: auto; }
    footer { padding: 14px 20px; background: var(--panel); border-top: 1px solid var(--line); flex-shrink: 0; }
    .input-row { max-width: 780px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
    #q { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; font-size: 15px; font-family: inherit; line-height: 1.5; max-height: 140px; outline: none; }
    #q:focus { border-color: var(--accent); }
    #send { background: var(--accent); color: #fff; border: none; border-radius: 12px;
      padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
    #send:disabled { opacity: .5; cursor: not-allowed; }
    @media (max-width: 640px) { #sidebar { display: none; } }
  </style>
</head>
<body>
  <div id="auth">
    <div class="card">
      <h1>⚖️ 법대로</h1>
      <div class="tagline">법조문·판례와 생활법령을 근거로 답해 드립니다.</div>
      <label for="au">아이디</label>
      <input id="au" autocomplete="username" />
      <label for="ap">비밀번호</label>
      <input id="ap" type="password" autocomplete="current-password" />
      <div id="passWrap" style="display:none">
        <label for="apc">초대 코드</label>
        <input id="apc" autocomplete="off" />
        <div class="hint">가입에는 초대 코드가 필요합니다.</div>
      </div>
      <button class="primary" id="authBtn">로그인</button>
      <div class="toggle" id="toggleWrap">계정이 없으신가요? <a id="toggleLink">회원가입</a></div>
      <div class="msg" id="authMsg"></div>
    </div>
  </div>
  <aside id="sidebar">
    <div class="top"><button id="newChat">+ 새 대화</button></div>
    <div id="convList"></div>
    <div class="bottom"><span id="whoami"></span><a id="logout">로그아웃</a></div>
  </aside>
  <div id="main">
    <header>
      <h2>법대로</h2>
      <div class="sub">예: "재혼 후 자녀 성을 바꿀 수 있나요?" / "음주운전 처벌 기준은?"</div>
    </header>
    <div id="chat"><div class="empty-hint" id="emptyHint">새 대화를 시작하세요.</div></div>
    <footer>
      <div class="input-row">
        <textarea id="q" rows="1" placeholder="질문을 입력하세요…"></textarea>
        <button id="send">전송</button>
      </div>
    </footer>
  </div>
  <aside id="docPanel">
    <div class="head"><strong>검색한 자료</strong><span class="close" id="docClose">×</span></div>
    <div id="docTitle"></div>
    <div id="docBody"></div>
    <div id="docHint">목록에서 자료를 올려놓거나 클릭하면 원문이 보입니다.</div>
  </aside>
  <script>
    const API = "";
    let mode = "login";
    let token = localStorage.getItem("token") || "";
    let username = localStorage.getItem("username") || "";
    let threadId = null;
    const authEl = document.getElementById("auth");
    const auInput = document.getElementById("au");
    const apInput = document.getElementById("ap");
    const apcInput = document.getElementById("apc");
    const passWrap = document.getElementById("passWrap");
    const authBtn = document.getElementById("authBtn");
    const toggleWrap = document.getElementById("toggleWrap");
    const authMsg = document.getElementById("authMsg");
    const convList = document.getElementById("convList");
    const whoami = document.getElementById("whoami");
    const chat = document.getElementById("chat");
    const q = document.getElementById("q");
    const sendBtn = document.getElementById("send");

    function setMode(m) {
      mode = m; authMsg.textContent = "";
      passWrap.style.display = m === "register" ? "block" : "none";
      if (m === "login") {
        authBtn.textContent = "로그인";
        toggleWrap.innerHTML = '계정이 없으신가요? <a id="toggleLink">회원가입</a>';
      } else {
        authBtn.textContent = "회원가입";
        toggleWrap.innerHTML = '이미 계정이 있으신가요? <a id="toggleLink">로그인</a>';
      }
      document.getElementById("toggleLink").onclick = () => setMode(m === "login" ? "register" : "login");
    }
    async function submitAuth() {
      const u = auInput.value.trim(); const p = apInput.value;
      if (!u || !p) { showAuthMsg("아이디와 비밀번호를 입력하세요.", "error"); return; }
      authBtn.disabled = true;
      try {
        if (mode === "register") {
          const res = await fetch(API + "/api/register", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: u, password: p, passcode: apcInput.value.trim() }) });
          const data = await res.json();
          if (!res.ok) { showAuthMsg(data.detail || "가입 실패", "error"); return; }
          apcInput.value = "";
          showAuthMsg("가입 완료! 로그인하세요.", "ok"); setMode("login");
        } else {
          const res = await fetch(API + "/api/login", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: u, password: p }) });
          const data = await res.json();
          if (!res.ok) { showAuthMsg(data.detail || "로그인 실패", "error"); return; }
          token = data.token; username = u;
          localStorage.setItem("token", token); localStorage.setItem("username", username);
          enterApp();
        }
      } catch (e) { showAuthMsg("서버에 연결할 수 없습니다.", "error"); }
      finally { authBtn.disabled = false; }
    }
    function showAuthMsg(text, kind) { authMsg.textContent = text; authMsg.className = "msg " + (kind || ""); }
    authBtn.onclick = submitAuth;
    apInput.onkeydown = (e) => { if (e.key === "Enter") submitAuth(); };

    function enterApp() {
      authEl.style.display = "none"; whoami.textContent = username;
      loadConversations(); startNewChat();
    }
    document.getElementById("logout").onclick = () => {
      localStorage.removeItem("token"); localStorage.removeItem("username");
      token = ""; username = ""; authEl.style.display = "flex";
      convList.innerHTML = ""; chat.innerHTML = '<div class="empty-hint">새 대화를 시작하세요.</div>';
    };

    async function loadConversations() {
      try {
        const res = await fetch(API + "/api/conversations", { headers: { "Authorization": "Bearer " + token } });
        if (res.status === 401) { forceLogout(); return; }
        const data = await res.json(); renderConvList(data.conversations || []);
      } catch (e) {}
    }
    function renderConvList(items) {
      convList.innerHTML = "";
      items.forEach((c) => {
        const div = document.createElement("div");
        div.className = "conv-item" + (c.thread_id === threadId ? " active" : "");
        const title = document.createElement("span");
        title.className = "title"; title.textContent = c.title || "제목 없음";
        title.onclick = () => openConversation(c.thread_id);
        const del = document.createElement("span");
        del.className = "del"; del.textContent = "×"; del.title = "대화 삭제";
        del.onclick = (e) => { e.stopPropagation(); deleteConversation(c.thread_id); };
        div.appendChild(title); div.appendChild(del);
        convList.appendChild(div);
      });
    }
    async function deleteConversation(tid) {
      if (!confirm("이 대화를 삭제할까요?")) return;
      try {
        const res = await fetch(API + "/api/conversations/" + tid, {
          method: "DELETE", headers: { "Authorization": "Bearer " + token } });
        if (res.status === 401) { forceLogout(); return; }
        if (!res.ok) return;
        if (tid === threadId) startNewChat(); else loadConversations();
      } catch (e) {}
    }
    async function openConversation(tid) {
      try {
        const res = await fetch(API + "/api/conversations/" + tid, { headers: { "Authorization": "Bearer " + token } });
        if (res.status === 401) { forceLogout(); return; }
        const data = await res.json();
        threadId = tid; chat.innerHTML = "";
        (data.messages || []).forEach((m) => addMsg(m.role === "user" ? "user" : "bot", m.content));
        loadConversations();
      } catch (e) {}
    }
    function startNewChat() {
      threadId = null;
      chat.innerHTML = '<div class="empty-hint">무엇이든 물어보세요.</div>';
      loadConversations(); q.focus();
    }
    document.getElementById("newChat").onclick = startNewChat;

    // 답변은 마크다운으로 온다(**굵게**, ## 제목, - 목록). 모델이 만든 문자열이므로
    // 반드시 먼저 이스케이프한 뒤에 우리가 만든 태그만 끼워 넣는다.
    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function renderMarkdown(src) {
      const inline = (t) => t
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>")
        .replace(/`([^`]+)`/g, "<code>$1</code>");
      const out = [];
      let list = null;
      const closeList = () => { if (list) { out.push("</" + list + ">"); list = null; } };
      for (const raw of escapeHtml(src).split("\n")) {
        const line = raw.trim();
        if (!line) { closeList(); continue; }
        let m;
        if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {
          closeList();
          const lvl = Math.min(m[1].length + 2, 5);
          out.push(`<h${lvl}>${inline(m[2])}</h${lvl}>`);
        } else if ((m = line.match(/^[-*]\s+(.*)$/))) {
          if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
          out.push(`<li>${inline(m[1])}</li>`);
        } else if ((m = line.match(/^\d+\.\s+(.*)$/))) {
          if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
          out.push(`<li>${inline(m[1])}</li>`);
        } else {
          closeList();
          out.push(`<p>${inline(line)}</p>`);
        }
      }
      closeList();
      return out.join("");
    }
    // 답변 말풍선에 본문을 채운다. 사용자 입력은 마크다운으로 해석하지 않는다.
    // 본문을 .md-body 안에 두는 이유: 토큰이 올 때마다 다시 그리는데,
    // 말풍선을 통째로 덮으면 뒤에 붙인 '검색한 자료'가 지워진다.
    function setAnswer(bubble, text) {
      bubble.classList.add("md");
      let body = bubble.querySelector(".md-body");
      if (!body) {
        bubble.textContent = "";
        body = document.createElement("div");
        body.className = "md-body";
        bubble.appendChild(body);
      }
      body.innerHTML = renderMarkdown(text);
    }
    // 오른쪽 원문 패널
    const docPanel = document.getElementById("docPanel");
    const docTitle = document.getElementById("docTitle");
    const docBody = document.getElementById("docBody");
    const docHint = document.getElementById("docHint");
    document.getElementById("docClose").onclick = () => docPanel.classList.remove("open");

    function showDoc(doc, li) {
      docPanel.classList.add("open");
      docHint.style.display = "none";
      docTitle.textContent = doc.source;     // 서버 문자열이므로 textContent 로만
      docBody.textContent = doc.content || "(본문이 없습니다)";
      docBody.scrollTop = 0;
      if (li) {
        li.parentElement.querySelectorAll("li.active").forEach((x) => x.classList.remove("active"));
        li.classList.add("active");
      }
    }

    // 검색한 자료 목록. 답변에 인용되지 않은 것도 들어 있으므로
    // '근거'가 아니라 '검색한 자료'라고 부른다.
    function setSources(bubble, list) {
      if (!list || !list.length) return;
      bubble.querySelector(".sources")?.remove();
      const box = document.createElement("details");
      box.className = "sources";
      box.open = true;
      const sum = document.createElement("summary");
      sum.textContent = `검색한 자료 ${list.length}건`;
      box.appendChild(sum);
      const ul = document.createElement("ul");
      for (const doc of list) {
        const li = document.createElement("li");
        li.textContent = doc.source;
        li.onmouseenter = () => showDoc(doc, li);
        li.onclick = () => showDoc(doc, li);
        ul.appendChild(li);
      }
      box.appendChild(ul);
      bubble.appendChild(box);
      // 답변이 끝나면 첫 자료를 오른쪽에 자동으로 띄워 둔다
      showDoc(list[0], ul.firstChild);
    }

    function addMsg(role, text) {
      const hint = chat.querySelector(".empty-hint");
      if (hint) hint.remove();
      const wrap = document.createElement("div");
      wrap.className = "msg " + role;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (role === "bot" && text) setAnswer(bubble, text);
      else bubble.textContent = text;
      wrap.appendChild(bubble); chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }
    q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 140) + "px"; });

    async function send() {
      const question = q.value.trim();
      if (!question) return;
      addMsg("user", question);
      q.value = ""; q.style.height = "auto"; sendBtn.disabled = true;
      const botBubble = addMsg("bot", ""); botBubble.classList.add("pending");
      const isNew = !threadId;
      try {
        const res = await fetch(API + "/api/query/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ question, thread_id: threadId }) });
        if (res.status === 401) { forceLogout(); return; }
        if (!res.ok) { botBubble.classList.remove("pending"); botBubble.textContent = "오류: 서버 응답 " + res.status; return; }
        const reader = res.body.getReader(); const decoder = new TextDecoder();
        let buffer = "", answer = "";
        const statuses = new Set();   // 이번 응답에서 진행 중인 작업 안내
        // 도구가 아직 안 돌았으면 일반 안내를 보여준다(빈 말풍선 방지)
        const renderStatus = () => {
          botBubble.classList.add("status");
          botBubble.classList.remove("md");
          botBubble.innerHTML = "";
          botBubble.append(statuses.size ? [...statuses].join(" · ") : "질문을 살펴보는 중입니다");
          const d = document.createElement("span");
          d.className = "status-dots";
          botBubble.append(d);
          chat.scrollTop = chat.scrollHeight;
        };
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n"); buffer = parts.pop();
          for (const part of parts) {
            const line = part.trim();
            if (!line.startsWith("data:")) continue;
            const payload = line.slice(5).trim();
            if (payload === "[DONE]") continue;
            try {
              const obj = JSON.parse(payload);
              if (obj.thread_id) threadId = obj.thread_id;
              // 도구 호출 턴이었으므로 지금까지 찍힌 텍스트를 버린다.
              // 빈 말풍선이 남지 않도록 곧바로 진행 상황을 보여준다.
              if (obj.reset) { answer = ""; renderStatus(); }
              // 도구는 병렬 실행되므로 동시에 도는 작업을 함께 보여준다.
              // 답변 토큰이 나오기 시작하면 표시하지 않는다.
              if (obj.status && !answer) { statuses.add(obj.status); renderStatus(); }
              if (obj.token) {
                if (!answer) { statuses.clear(); botBubble.classList.remove("status"); botBubble.textContent = ""; }
                answer += obj.token; setAnswer(botBubble, answer); chat.scrollTop = chat.scrollHeight;
              }
              if (obj.error) {
                botBubble.classList.remove("status");
                answer += "\n[오류] " + obj.error; setAnswer(botBubble, answer);
              }
              if (obj.sources) setSources(botBubble, obj.sources);
            } catch (_) {}
          }
        }
        botBubble.classList.remove("pending");
        if (!answer) { botBubble.classList.remove("status"); botBubble.textContent = "(응답이 비어 있습니다)"; }
        if (isNew) loadConversations();
      } catch (e) { botBubble.classList.remove("pending"); botBubble.textContent = "오류: " + e.message; }
      finally { sendBtn.disabled = false; q.focus(); }
    }
    sendBtn.onclick = send;
    q.addEventListener("keydown", (e) => {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    function forceLogout() {
      localStorage.removeItem("token"); localStorage.removeItem("username"); token = "";
      authEl.style.display = "flex"; showAuthMsg("세션이 만료되었습니다. 다시 로그인하세요.", "error");
    }
    setMode("login");
    if (token) enterApp();
  </script>
</body>
</html>
